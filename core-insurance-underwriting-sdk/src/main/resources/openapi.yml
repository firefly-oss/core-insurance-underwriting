components:
  schemas:
    SubmissionDTO:
      required:
      - lineOfBusiness
      - partyId
      - productId
      - receivedAt
      - submissionNumber
      - submissionStatus
      - tenantId
      type: object
      properties:
        submissionId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        submissionNumber:
          maxLength: 64
          minLength: 0
          type: string
        partyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        distributorId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        submissionStatus:
          type: string
          enum:
          - RECEIVED
          - IN_CLEARANCE
          - REFERRED
          - QUOTED
          - BOUND
          - DECLINED
          - WITHDRAWN
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        receivedAt:
          type: string
          format: date-time
        currency:
          pattern: "[A-Z]{3}"
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubjectivityDTO:
      required:
      - description
      - quoteId
      - subjectivityStatus
      - submissionId
      type: object
      properties:
        subjectivityId:
          type: string
          format: uuid
          readOnly: true
        submissionId:
          type: string
          format: uuid
        quoteId:
          type: string
          format: uuid
        description:
          maxLength: 4000
          minLength: 0
          type: string
        subjectivityStatus:
          type: string
          enum:
          - OPEN
          - SATISFIED
          - WAIVED
        dueDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubmissionStatusHistoryDTO:
      required:
      - changedAt
      - submissionId
      - submissionStatus
      type: object
      properties:
        submissionStatusHistoryId:
          type: string
          format: uuid
          readOnly: true
        submissionId:
          type: string
          format: uuid
        submissionStatus:
          type: string
          enum:
          - RECEIVED
          - IN_CLEARANCE
          - REFERRED
          - QUOTED
          - BOUND
          - DECLINED
          - WITHDRAWN
        statusReason:
          maxLength: 500
          minLength: 0
          type: string
        changedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StatementOfValueDTO:
      required:
      - lineNumber
      - submissionId
      type: object
      properties:
        statementOfValueId:
          type: string
          format: uuid
          readOnly: true
        submissionId:
          type: string
          format: uuid
        lineNumber:
          type: integer
          format: int32
        locationReference:
          maxLength: 128
          minLength: 0
          type: string
        occupancy:
          maxLength: 128
          minLength: 0
          type: string
        declaredValue:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        sourceReference:
          maxLength: 128
          minLength: 0
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SanctionsScreenDTO:
      required:
      - partyId
      - screeningStatus
      - submissionId
      type: object
      properties:
        sanctionsScreenId:
          type: string
          format: uuid
          readOnly: true
        submissionId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        screeningStatus:
          type: string
          enum:
          - CLEAR
          - POTENTIAL_MATCH
          - CONFIRMED_MATCH
          - NOT_SCREENED
        providerReference:
          maxLength: 128
          minLength: 0
          type: string
        screenedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubmissionRiskDTO:
      required:
      - insuredObjectType
      - riskNumber
      - submissionId
      type: object
      properties:
        submissionRiskId:
          type: string
          format: uuid
          readOnly: true
        submissionId:
          type: string
          format: uuid
        riskNumber:
          maxLength: 64
          minLength: 0
          type: string
        description:
          maxLength: 4000
          minLength: 0
          type: string
        insuredObjectType:
          type: string
          enum:
          - PERSON
          - VEHICLE
          - PROPERTY
          - VESSEL
          - AIRCRAFT
          - LIABILITY
          - OTHER
        partyId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReferralDTO:
