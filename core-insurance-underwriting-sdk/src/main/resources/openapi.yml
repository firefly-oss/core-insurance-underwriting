openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Statements of Value
  description: One normalized statement-of-values line on a submission
- name: Quotes
  description: Quote prepared from authorized terms. Rating stays outside this service.
- name: Loss Runs
  description: Prior-year loss run summarized by line and cause
- name: Underwriting Decisions
  description: Recorded underwriting decision. Authority stays with the insurer.
- name: Subjectivities
  description: Condition that must be cleared before bind
- name: Clearances
  description: Clearance of a submission against in-force business and the broker
    of record
- name: Referrals
  description: Referral of a submission to a person with delegated authority
- name: Underwriting Evidence
  description: Evidence reference on a submission. The document bytes stay in document
    management.
- name: Sanctions Screens
  description: Recorded sanctions screening result. The check itself stays with the
    provider.
- name: Submission Status History
  description: Status change recorded against a submission
- name: Submission Risks
  description: Risk item on a submission
- name: Submissions
  description: Underwriting submission received for a product and applicant
paths:
  /api/v1/submissions/{submissionId}:
    get:
      tags:
      - Submissions
      summary: Get Submission by id
      description: Retrieve one Submission
      operationId: getSubmissionById
      parameters:
      - name: submissionId
        in: path
        description: Unique identifier of the Submission
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Submission found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionDTO"
        "404":
          description: Submission not found
    put:
      tags:
      - Submissions
      summary: Update Submission
      description: Update an existing Submission
      operationId: updateSubmission
      parameters:
      - name: submissionId
        in: path
        description: Unique identifier of the Submission
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionDTO"
        required: true
      responses:
        "200":
          description: Submission updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionDTO"
        "400":
          description: Invalid data
        "404":
          description: Submission not found
    delete:
      tags:
      - Submissions
      summary: Delete Submission
      description: Delete a Submission
      operationId: deleteSubmission
      parameters:
      - name: submissionId
        in: path
        description: Unique identifier of the Submission
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Submission deleted
        "404":
          description: Submission not found
