          type: string
          format: uuid
          readOnly: true
        submissionId:
          type: string
          format: uuid
        reason:
          maxLength: 4000
          minLength: 0
          type: string
        authorityLevel:
          maxLength: 100
          minLength: 0
          type: string
        referralStatus:
          type: string
          enum:
