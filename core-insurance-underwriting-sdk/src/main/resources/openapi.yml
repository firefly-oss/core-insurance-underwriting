          - DRAFT
          - PRESENTED
          - ACCEPTED
          - EXPIRED
          - DECLINED
        premiumAmount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        validUntil:
          type: string
          format: date
        boundPolicyId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LossRunDTO:
